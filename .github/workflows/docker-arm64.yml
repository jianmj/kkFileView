name: Docker ARM64

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build ARM64 application package
        run: mvn -B -Pdocker-arm64 -DskipTests package

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 runtime and application images
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 -t kkfileview-base:ci ./docker/kkfileview-base
          docker build --platform linux/arm64 \
            --build-arg BASE_IMAGE=kkfileview-base:ci \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}-arm64" -t "${IMAGE}:arm64" .
          test "$(docker image inspect "${IMAGE}:arm64" --format '{{.Architecture}}')" = arm64
          docker run --rm --entrypoint java "${IMAGE}:arm64" -version
          docker run --rm --entrypoint libreoffice "${IMAGE}:arm64" --headless --version

      - name: Smoke test application startup
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker run -d --name kkfileview-smoke -p 127.0.0.1:8012:8012 \
            -e KK_CACHE_TYPE=jdk "${IMAGE}:arm64"
          trap 'docker rm -f kkfileview-smoke >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 --output /dev/null http://127.0.0.1:8012/; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' kkfileview-smoke)" != true ]; then
              break
            fi
            sleep 5
          done
          docker logs --tail 150 kkfileview-smoke
          exit 1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified ARM64 image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_SHA}-arm64"
          docker push "${IMAGE}:arm64"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            docker tag "${IMAGE}:arm64" "${IMAGE}:${version}-arm64"
            docker push "${IMAGE}:${version}-arm64"
          fi
          echo "### ARM64 image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker pull ${IMAGE}:${GITHUB_SHA}-arm64\`" >> "$GITHUB_STEP_SUMMARY"
